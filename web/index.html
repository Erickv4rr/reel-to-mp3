<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel to MP3</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --text: #17171c; --muted: #6b6b76; --line: #e4e4ea;
    --accent: #dd2a7b; --accent-2: #8134af; --ok: #1f9d55; --err: #d64545; --field: #fbfbfd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114; --card: #1b1b20; --text: #ececf1; --muted: #9a9aa6; --line: #2c2c34;
      --ok: #3ccf7a; --err: #ff6b6b; --field: #15151a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 40px; height: 40px; }
  h1 { font-size: 22px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .grow { flex: 1; }
  label { color: var(--muted); font-size: 13px; }
  select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; }
  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--line);
           background: var(--field); color: var(--text); }
  button:hover { border-color: var(--muted); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; font-weight: 600; }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .msg { font-size: 13px; color: var(--err); min-height: 1em; }
  .job { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .job:first-of-type { border-top: none; }
  .job .url { font-size: 13px; word-break: break-all; }
  .job .detail { font-size: 12px; color: var(--muted); word-break: break-word; }
  .job.error .detail { color: var(--err); }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
  .running .dot { border: 2px solid var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  .done .dot { background: var(--ok); }
  .error .dot { background: var(--err); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .file { padding: 12px 0; border-top: 1px solid var(--line); }
  .file:first-of-type { border-top: none; }
  .file .name { font-weight: 500; word-break: break-word; }
  .file .meta { font-size: 12px; color: var(--muted); }
  .file audio { width: 100%; height: 36px; margin-top: 8px; }
  .file .actions { display: flex; gap: 6px; margin-top: 6px; }
  .empty { color: var(--muted); font-size: 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .head h2 { margin: 0; }
  .folderRow { margin: 4px 0 0; }
  .folderRow input { min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--field); color: var(--text); font: 13px Consolas, monospace; }
  .folderRow input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .msg.ok { color: var(--ok); }
  @media (max-width: 520px) { .folderRow input { flex-basis: 100%; } }
  #offline { display: none; background: var(--err); color: #fff; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/favicon.svg" alt="">
    <div>
      <h1>Reel to MP3</h1>
      <p>Paste an Instagram Reel link and get the audio as an MP3.</p>
    </div>
  </header>

  <div id="offline">Can't reach Reel to MP3. Open the Reel to MP3 app, then reload this page.</div>

  <section class="card">
    <h2>Links</h2>
    <textarea id="urls" placeholder="https://www.instagram.com/reel/...&#10;One link per line"></textarea>
    <div class="row">
      <label for="cookies">Login cookies</label>
      <select id="cookies"><option value="none">none</option></select>
      <span class="grow"></span>
      <button class="primary" id="go">Download MP3</button>
    </div>
    <div class="row"><span class="msg" id="msg"></span></div>
    <label>Set login cookies to the browser you use for Instagram only if a reel fails with "login required" or "empty media response".</label>
  </section>

  <section class="card" id="jobsCard" hidden>
    <div class="head"><h2>Progress</h2><button class="small" id="clear">Clear finished</button></div>
    <div id="jobs"></div>
  </section>

  <section class="card">
    <div class="head"><h2>Your MP3s</h2><button class="small" id="openFolder">Open folder</button></div>
    <div class="row folderRow">
      <label for="folder">Save to</label>
      <input id="folder" class="grow" spellcheck="false" placeholder="Folder where MP3s are saved">
      <button class="small" id="pickFolder">Browse...</button>
      <button class="small" id="saveFolder" hidden>Save</button>
    </div>
    <div class="row" style="margin-top:4px"><span class="msg" id="folderMsg"></span></div>
    <div id="files"><p class="empty">Nothing here yet.</p></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post = (url, body) => fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});

try { const c = localStorage.getItem('cookies'); if (c) $('cookies').dataset.saved = c; } catch {}

let fileSig = '';
let anyRunning = false;

async function refreshJobs() {
  const r = await fetch('/api/jobs').then(r => r.json());
  const sel = $('cookies');
  if (sel.options.length < 2) {
    sel.innerHTML = r.browsers.map(b => `<option>${esc(b)}</option>`).join('');
    if (sel.dataset.saved) sel.value = sel.dataset.saved;
  }
  $('jobsCard').hidden = r.jobs.length === 0;
  $('jobs').innerHTML = r.jobs.map(j => `
    <div class="job ${j.status}">
      <div class="dot"></div>
      <div>
        <div class="url">${esc(j.url)}</div>
        <div class="detail">${esc(j.status === 'done' ? 'Saved: ' + j.file : j.status === 'error' ? j.error : j.last || 'Starting...')}</div>
      </div>
    </div>`).join('');
  const wasRunning = anyRunning;
  anyRunning = r.jobs.some(j => j.status === 'running');
  $('go').disabled = false;
  if (wasRunning && !anyRunning) refreshFiles();
}

async function refreshFiles() {
  const r = await fetch('/api/files').then(r => r.json());
  if (document.activeElement !== $('folder') && $('saveFolder').hidden) $('folder').value = r.folder;
  savedFolder = r.folder;
  const sig = r.folder + '|' + r.files.map(f => f.name + f.mtime).join('|');
  if (sig === fileSig) return;
  fileSig = sig;
  if (!r.files.length) { $('files').innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  $('files').innerHTML = r.files.map(f => {
    const src = '/files/' + encodeURIComponent(f.name);
    const when = new Date(f.mtime * 1000).toLocaleString();
    return `<div class="file">
      <div class="name">${esc(f.name.replace(/\.mp3$/i, ''))}</div>
      <div class="meta">${(f.size / 1048576).toFixed(1)} MB · ${esc(when)}</div>
      <audio controls preload="none" src="${src}"></audio>
      <div class="actions">
        <a href="${src}?dl=1"><button class="small">Download</button></a>
        <button class="small" data-del="${esc(f.name)}">Delete</button>
      </div>
    </div>`;
  }).join('');
}

$('go').onclick = async () => {
  $('msg').textContent = '';
  const urls = $('urls').value.trim();
  if (!urls) { $('msg').textContent = 'Paste a link first.'; return; }
  try { localStorage.setItem('cookies', $('cookies').value); } catch {}
  $('go').disabled = true;
  const r = await post('/api/download', {urls, cookies: $('cookies').value});
  const data = await r.json();
  if (!r.ok) { $('msg').textContent = data.error; $('go').disabled = false; return; }
  $('urls').value = '';
  anyRunning = true;
  refreshJobs();
};

let savedFolder = '';
function folderStatus(text, ok) { $('folderMsg').textContent = text; $('folderMsg').className = 'msg' + (ok ? ' ok' : ''); }
async function changeFolder(body) {
  folderStatus(body.pick ? 'Choose a folder in the window that just opened...' : '', true);
  const r = await post('/api/folder', body);
  const data = await r.json();
  if (!r.ok) { folderStatus(data.error); return; }
  $('folder').value = data.folder;
  $('saveFolder').hidden = true;
  folderStatus(data.cancelled ? '' : 'New MP3s will be saved here.', true);
  if (!data.cancelled) refreshFiles();
}
$('folder').addEventListener('input', () => { $('saveFolder').hidden = $('folder').value.trim() === savedFolder; folderStatus(''); });
$('folder').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveFolder').click(); });
$('saveFolder').onclick = () => changeFolder({path: $('folder').value});
$('pickFolder').onclick = () => changeFolder({pick: true});

$('urls').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('go').click(); });
$('clear').onclick = () => post('/api/clear-jobs').then(refreshJobs);
$('openFolder').onclick = () => post('/api/open-folder');
$('files').onclick = async e => {
  const name = e.target.dataset.del;
  if (!name || !confirm('Delete "' + name + '"?')) return;
  await post('/api/delete', {name});
  refreshFiles();
};

async function tick() {
  try {
    await refreshJobs();
    $('offline').style.display = 'none';
  } catch { $('offline').style.display = 'block'; }
  setTimeout(tick, anyRunning ? 1000 : 4000);
}
refreshFiles().catch(() => {});
tick();
</script>
</body>
</html>
