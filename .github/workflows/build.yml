name: Build apps

# Push a tag like v1.2.0 (matching version.py) to build the Windows and Mac apps and publish a release.
# "Run workflow" on the Actions tab builds them without publishing (download from the run page).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-applesilicon
            dmg: Reel-to-MP3-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            name: mac-intel
            dmg: Reel-to-MP3-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "from version import __version__; print(__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match version.py ($v)"; exit 1; }

      - name: Install
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Build app
        run: python build.py

      - name: Windows installer and portable exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python build.py --onefile
          Move-Item "dist/Reel to MP3.exe" "dist/Reel-to-MP3-Windows-Portable.exe"
          New-Item -ItemType Directory out | Out-Null
          Move-Item dist/Reel-to-MP3-Setup.exe, dist/Reel-to-MP3-Windows-Portable.exe out/

      - name: Mac disk image
        if: runner.os == 'macOS'
        run: |
          mkdir dmg out
          ditto "dist/Reel to MP3.app" "dmg/Reel to MP3.app"
          ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Reel to MP3" -srcfolder dmg -ov -format UDZO "out/${{ matrix.dmg }}" && break
            sleep 5
          done
          test -f "out/${{ matrix.dmg }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Windows
          Download **Reel-to-MP3-Setup.exe** and run it. It adds Reel to MP3 to your Start menu (and desktop, if you tick the box).
          If Windows shows "Windows protected your PC", click **More info → Run anyway**.
          Prefer no install? Use **Reel-to-MP3-Windows-Portable.exe** instead.

          ### Mac
          Download the `.dmg` for your Mac (Apple menu → About This Mac: **Chip: Apple M…** → AppleSilicon, **Processor: Intel** → Intel).
          Open it and drag **Reel to MP3** into **Applications**.
          The first time you open it, macOS says it can't check it for malware. Click **Done**, then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only need to do this once.

          Reel to MP3 checks for new versions when it starts and tells you when one is available.
          EOF
          ls -la out
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "Reel to MP3 ${GITHUB_REF_NAME}" --notes-file notes.md
